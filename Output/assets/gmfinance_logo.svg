<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .chess-line { stroke: #000000; stroke-width: 14; fill: none; }
      .king-piece { fill: #000000; }
      .brand-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 32px; fill: #000000; letter-spacing: 2px; text-anchor: middle; }
      .brand-sub { font-family: 'Inter', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #000000; letter-spacing: 3px; text-anchor: middle; }
      .brand-the { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 20px; fill: #000000; text-anchor: middle; }
    </style>
  </defs>
  
  <rect class="bg" width="500" height="500"/>
  
  <!-- Outer Circle -->
  <circle cx="250" cy="190" r="110" class="chess-line"/>
  
  <!-- Chessboard Background Grid Pattern in Circle -->
  <g opacity="0.15">
    <rect x="180" y="110" width="35" height="35" fill="#000"/>
    <rect x="250" y="110" width="35" height="35" fill="#000"/>
    <rect x="145" y="145" width="35" height="35" fill="#000"/>
    <rect x="215" y="145" width="35" height="35" fill="#000"/>
    <rect x="285" y="145" width="35" height="35" fill="#000"/>
    <rect x="180" y="180" width="35" height="35" fill="#000"/>
    <rect x="250" y="180" width="35" height="35" fill="#000"/>
    <rect x="145" y="215" width="35" height="35" fill="#000"/>
    <rect x="215" y="215" width="35" height="35" fill="#000"/>
    <rect x="285" y="215" width="35" height="35" fill="#000"/>
  </g>
  
  <!-- Chess King Silhouette -->
  <g class="king-piece">
    <!-- Cross on top -->
    <path d="M245,65 h10 v10 h10 v10 h-10 v10 h-10 v-10 h-10 v-10 h10 z"/>
    <!-- Head crown -->
    <path d="M220,105 c0,-15 15,-20 30,-20 c15,0 30,5 30,20 c0,15 -10,25 -10,25 h-40 c0,0 -10,-10 -10,-25 z"/>
    <ellipse cx="250" cy="130" rx="32" ry="8"/>
    <!-- Neck -->
    <path d="M225,135 c10,15 5,40 -15,70 c-10,15 -5,35 0,40 h80 c5,-5 10,-25 0,-40 c-20,-30 -25,-55 -15,-70 z"/>
    <!-- Base Rings -->
    <path d="M200,248 h100 c5,0 10,5 10,10 v5 h-120 v-5 c0,-5 5,-10 10,-10 z"/>
    <rect x="185" y="267" width="130" height="14" rx="4"/>
  </g>

  <!-- Typography -->
  <text x="250" y="325" class="brand-the">The</text>
  <text x="250" y="365" class="brand-title">GMFINANCE</text>
  <text x="250" y="405" class="brand-sub">ELEVATE EXPERTISE,</text>
  <text x="250" y="425" class="brand-sub">EXPAND CAREER HORIZONS</text>
</svg>
